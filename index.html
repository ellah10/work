<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laisser un avis</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial;
      background:#f5f5f5;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    button{
      background:#000;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      opacity:.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Votre avis compte </h1>

    <p>Laissez-nous un avis sur Google Maps.</p>

    <button onclick="leaveReview()">
      Laisser un avis
    </button>
  </div>

  <script>
    function leaveReview(){
      window.location.href =
      "https://share.google/IunedTOVxC9gZ7OHp";
    }
  </script>

</body>
</html>
